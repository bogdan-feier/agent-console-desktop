# A Cargo "workspace": one repository, several crates (Rust packages) that are
# built together and share one Cargo.lock and one target/ folder.
[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Versions shared by both crates are declared once, here.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }

[profile.release]
# Smaller, faster app at the cost of a slower release build.
lto = true
codegen-units = 1
strip = true
