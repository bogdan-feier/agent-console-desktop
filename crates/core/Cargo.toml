[package]
name = "agent-console-core"
description = "Runs a planner, workers and reviewers by driving the claude CLI. No UI code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Only for killpg: stopping an agent has to stop everything it started.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
